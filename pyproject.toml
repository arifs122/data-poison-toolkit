[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "datapoisontoolkit"
dynamic = ["version"]
description = "A Comprehensive Framework for ML Security Research"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Muhammet Anil Yagiz"},
    {name = "Muhammed Arif Dayi"},
    {name = "Dr. Polat Goktas"},
]
maintainers = [
    {name = "Muhammet Anil Yagiz"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "torchaudio>=2.8.0",
    "scipy>=1.16.0",
    "joblib>=1.5.0",
    "tqdm>=4.67.0",
    "sympy>=1.14.0",
    "mpmath>=1.3.0",
]
keywords = [
    "machine learning",
    "security", 
    "data poisoning",
    "adversarial attacks",
    "defense mechanisms",
    "research",
    "pytorch",
    "scikit-learn",
]

[project.optional-dependencies]
research = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "notebook>=6.4.0",
    "ipython>=9.0.0",
]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
    "pre-commit>=2.15.0",
]
all = [
    "datapoisontoolkit[research,dev]",
]

[project.urls]
Homepage = "https://github.com/[username]/data-poison-toolkit"
Documentation = "https://github.com/[username]/data-poison-toolkit#readme"
Repository = "https://github.com/[username]/data-poison-toolkit"
"Bug Tracker" = "https://github.com/[username]/data-poison-toolkit/issues"
"Research Paper" = "https://github.com/[username]/data-poison-toolkit/blob/main/paper.md"

[project.scripts]
datapoisontoolkit = "datapoisontoolkit.demo_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datapoisontoolkit = [
    "data/*.csv",
    "data/*.json", 
    "config/*.yaml",
]

[tool.setuptools_scm]
write_to = "src/datapoisontoolkit/_version.py"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["datapoisontoolkit"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.coverage.run]
source = ["src/datapoisontoolkit"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]